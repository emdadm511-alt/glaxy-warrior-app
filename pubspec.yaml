name: Build Game APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Configure Android & AdMob
        run: |
          flutter create --project-name galaxy_warrior --platforms=android --org com.galaxy.warrior .
          
          python3 -c "
          import os

          # 1. AndroidManifest.xml-এ AdMob App ID যোগ করা
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r') as f:
                  txt = f.read()
              if 'com.google.android.gms.ads.APPLICATION_ID' not in txt:
                  ad_meta = '    <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"ca-app-pub-3940256099942544~3347511713\"/>\n</application>'
                  txt = txt.replace('</application>', ad_meta)
                  with open(manifest_path, 'w') as f:
                      f.write(txt)

          # 2. build.gradle-এ minSdk 21 ও multiDex যোগ করা
          gradle_path = 'android/app/build.gradle'
          if os.path.exists(gradle_path):
              with open(gradle_path, 'r') as f:
                  gtxt = f.read()
              gtxt = gtxt.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 21')
              gtxt = gtxt.replace('minSdk = flutter.minSdkVersion', 'minSdk = 21')
              if 'multiDexEnabled' not in gtxt:
                  gtxt = gtxt.replace('defaultConfig {', 'defaultConfig {\n        multiDexEnabled true')
              with open(gradle_path, 'w') as f:
                  f.write(gtxt)
          "

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Warrior-AdMob-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
