name: Build Game APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Build Android Scaffolding & AdMob Setup
        run: |
          # প্রজেক্ট নেম স্পষ্টভাবে উল্লেখ করে অ্যান্ড্রয়েড ফাইল তৈরি করা
          flutter create --project-name galaxy_warrior --platforms=android --org com.galaxy.warrior .
          
          # AdMob টেস্ট App ID যুক্ত করা
          sed -i 's|</application>|    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>\n    </application>|g' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Warrior-AdMob-APK
          path: build/app/outputs/flutter-apk/app-release.apk
